<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Админ контрол</title>
    <link rel="stylesheet" href="admin.css">
    <link rel="icon" href="Images/icon-inverted.png" type="image/jpeg">
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  </head>
<body>
<header>
  <div class="container">
    <div class="navigation-layout">
      <nav class="navbar">
        <ul class="nav-menu">
          <li class="nav-item">
            <a class="nav-link hover-underline-left" href="clients.html">Клиенти</a>
          </li>
        </ul>
      </nav>
          <img src="Images/icon-inverted.png" alt="Pilates Reformer Studio by Dilona Logo" class="logo" onclick="location.reload()"></img>
      </nav>
      <nav class="navbar">
        <ul class="nav-menu">
          <li class="nav-item">
            <a class="nav-link hover-underline-right" href="subscriptions.html">Абонаменти</a>
          </li>
        </ul>
      </nav>
    </div>
  </div>
</header>
<div class="title">
  <h1>Админ контрол</h1>
</div>
<section class="admin-control">
  <div class="container">
    <div class="calendar-grid">
      <div class="pendApprove">
        <div class="underline">
          <h2>Резервации</h2>
        </div>
        <div class="container ">
        <div class="subheader"> 
          <h3>Чакащи одобрение</h3>
        </div>
        <div class="pendingBookings">
          <div class="table-container">
            <table id="pendingBookingsTable">
              <thead>
                <tr>
                  <th>Клиент</th>
                  <th>Дата и час</th>
                  <th>Бележка</th>
                  <th>Действие</th>
                </tr>
              </thead>
              <tbody id="pendingBookingsTableBody">
              </tbody>
            </table>
            <div class="pagination" id="pendingPagination"></div>
          </div>
        </div>
        </div>
        <div class="container">
        <div class="subheader">
          <h3>Предстоящи</h3>
        </div>
        <div class="approvedBookings">
          <div class="table-container">
            <table id="approvedBookingsTable">
              <thead> 
                <tr>
                  <th>Клиент</th>
                  <th>Дата и час</th>
                  <th>Бележка</th>
                  <th>Действие </th>
                </tr>
              </thead>
              <tbody id="approvedBookingsTableBody">
              </tbody>
            </table>
            <div class="pagination" id="approvedPagination"></div>
          </div>
        </div>
          <div class="manualBookings">
            <div class="hint">
              <button class="add-booking-btn">Добави тренировка</button>
              <button class="refresh-btn">Обнови</button>
            </div>
            <div class="modal-overlay" id="modalOverlay"></div>
            <div class="modal" id="requestModal">
              <h3>Добави тренировка</h3>
              <div class="requestServices" id="requestServices">
                <form id="request-form">
                  <label for="booking-type">Вид тренировка*</label>
                  <select id="booking-type" name="booking_type" required>
                    <option value="">Избери ...</option>
                    <option value="Solo">Solo</option>
                    <option value="Private">Private</option>
                    <option value="Re4Me">Re4Me</option>
                    <option value="Six">Six</option>
                    <option value="Reform 8">Reform 8</option>
                  </select>
                  <small class="booking-hint"></small>
                  <label for="firstName">Име*</label>
                  <input type="text" id="firstName" name="client_firstName" maxlength="60" pattern="[А-Яа-яA-Za-z\s]+" required>
                  <label for="lastName">Фамилия*</label>
                  <input type="text" id="lastName" name="client_lastName" maxlength="60" pattern="[А-Яа-яA-Za-z\s]+" required>
                  <label for="phone">Телефон*</label>
                  <input type="text" id="phone" name="client_phone" maxlength="20" pattern="\d+" required>
                  <label for="booking-date-hour">Дата и час*</label>
                  <input type="text" id="booking-date-hour" name="booking_date_hour" readonly>
                  <label for="email">E-mail*</label>
                  <input type="email" id="email" name="client_email" maxlength="50" required>
                  <small class="booking-hint">*Задължителни полета.</small>
                  <label for="booking-note">Бележка</label>
                  <input type="text" id="booking-note" name="booking-note" maxlength="200" placeholder='"първа тренировка", "бременност" и др.'>
                  <label>
                    <input type="checkbox" id="subscribe-email" name="subscribe_email">
                    Абониране за имейл известия
                  </label>
                  <div class="form-buttons" style="align-items:center;">
                    <button type="submit" id="confirm-booking">Добави</button>
                    <button type="button" id="cancel-booking">Затвори</button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="adminCalendar">
        <div class="underline">
          <h2>График</h2>
        </div>
          <div class="calendar-wrap">
            <div class="calendar-nav">
              <button class="week-nav-btn" id="prev-week" type="button">Назад</button>
              <button class="week-nav-btn" id="today-week" type="button">Днес</button>
              <button class="week-nav-btn" id="next-week" type="button">Напред</button>
            </div>
              <div id="admin-calendar">
            </div>
            <div class="hint" id="hint">
              <small>Легенда: </small><br>
              <button class="slot week">Днес</button>
              <button class="slot past">Отминал</button>
              <button class="slot available">Свободен</button>
              <button class="slot pending">Нов</button>
              <button class="slot taken">Зает</button>
              <button class="slot holiday">Неработен</button>
            </div>
          </div>
      </div>
      <div class="active-holidays">
        <div class="underline">
          <h2>Почивни дни</h2>
        </div>
          <div class="table-container">
            <table id="holidaysTable">
              <thead>
                <tr>
                  <th>Дата</th>
                  <th>Час</th>
                  <th>Бележка</th>
                  <th>Действие</th>
                </tr>
              </thead>
              <tbody id="holidaysTableBody">
              </tbody>
            </table>
            <div class="pagination" id="holidayPagination"></div>
          </div>
          <div class="hint">
            <button class="add-holiday-btn">Добави почивка</button>
          </div>
      </div>
    </div>
    <div class="container">
      <div class="website-signature">
        <p>Website by <a href="https://www.vasilapostolov.tech/" class="links hover-underline-right">VA</a></p>
      </div>
    </div>
  </div>
</section>

<div class="dialog-overlay" id="dialogOverlay"></div>
<div class="dialog-modal" id="dialogModal" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
  <div class="dialog-content">
    <h3 id="dialog-title" class="dialog-title"></h3>
    <p class="dialog-message"></p>
    <input type="text" class="dialog-input" id="dialogInput" autocomplete="off" />
  </div>
  <div class="dialog-actions">
    <button type="button" class="dialog-btn dialog-cancel-btn">Отказ</button>
    <button type="button" class="dialog-btn dialog-confirm-btn">Да</button>
  </div>
</div>

<div class="hovering">
    <img src="Images/exit-icon.png" alt="Logout" id="logout-btn" class="logout-btn"></img>
    <img src="Images/settings-icon.svg" alt="Settings" id="settings-btn" class="settings-btn"></img>
</div>

<script src="admin.js"></script>
</body>
</html>
